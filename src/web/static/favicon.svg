<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Locus">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6c395"/>
      <stop offset="1" stop-color="#c9a87c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#211d1a"/>
      <stop offset="1" stop-color="#161310"/>
    </linearGradient>
  </defs>
  <!-- warm-dark rounded tile -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#tile)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" fill="none" stroke="#fff5e6" stroke-opacity="0.08"/>
  <!-- locus: a focal point found -->
  <circle cx="16" cy="16" r="7" fill="none" stroke="url(#amber)" stroke-width="2.4"/>
  <circle cx="16" cy="16" r="2.7" fill="url(#amber)"/>
</svg>
