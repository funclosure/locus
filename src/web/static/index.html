<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Locus</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="wordmark">Locus</span>
          <span id="summary" class="counts"></span>
        </div>
      </header>
      <div class="workspace">
        <nav class="index" aria-label="Companies">
          <div class="filters" aria-label="Browse controls">
            <input id="search" type="search" placeholder="Search" autocomplete="off" />
            <div class="filter-selects">
              <select id="statusFilter" aria-label="Status"></select>
              <select id="labelFilter" aria-label="Label"></select>
            </div>
          </div>
          <div id="companyList" class="company-index" aria-live="polite"></div>
          <div class="composer" id="composer">
            <form id="chatForm" class="command-bar">
              <input id="chatInput" type="text" placeholder="tell me what you think…" autocomplete="off" />
              <kbd class="command-hint">/</kbd>
            </form>
          </div>
        </nav>
        <article id="detailPanel" class="reading" aria-label="Company detail"></article>
        <aside id="profileRail" class="profile-rail" aria-label="Profile and direction"></aside>
      </div>
      <div id="chatOverlay" class="chat-overlay" hidden>
        <section class="chat-card" aria-label="Quick chat">
          <header class="chat-head">
            <span class="chat-title">Tell me</span>
            <button type="button" id="chatClose" class="chat-close" aria-label="Close">×</button>
          </header>
          <div id="chatLog" class="chat-log" aria-live="polite"></div>
        </section>
      </div>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
